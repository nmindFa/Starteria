[project]
name = "starteria-ai-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "deepagents>=0.1",
    "langchain>=0.3",
    "langchain-openrouter>=0.1",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    "langsmith>=0.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    # TASK-008 (pdf_extractor): PDF parsing dependencies.
    "pypdf>=4.0",
    "pdfplumber>=0.11",
    # TODO(ADR-004): add `langchain-anthropic` when swapping primary model to Haiku 4.5.
    # TODO(ADR-012): pgvector + sentence-transformers + psycopg deferred; one-shot full-text
    # extraction works for ≤50pp PDFs without vector retrieval.
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "freezegun>=1.5",
    "schemathesis>=3.30",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: fast unit tests",
    "integration: integration tests requiring services",
    "contract: contract tests against OpenAPI",
]

[tool.coverage.run]
# `middleware/` does not exist yet; remove it from source to avoid skewing the metric.
# When it is created, add it back to this list.
source = ["agents", "routers", "services", "schemas", "tools", "prompts"]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
