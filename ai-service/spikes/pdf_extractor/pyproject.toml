[project]
name = "starteria-pdf-extractor-spike"
version = "0.0.1"
description = "Time-boxed POC for PDF auto-fill agent (PRD-002). Not for production."
requires-python = ">=3.11"
dependencies = [
    "pypdf>=4.0",
    "pdfplumber>=0.11",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langchain-postgres>=0.0.12",
    "langchain-community>=0.3",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "sentence-transformers>=3.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501"]
