# Dependabot configuration — Starteria monorepo
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # ---------------------------------------------------------------------------
  # Front (Express + React monorepo, single package.json)
  # ---------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/front"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ecosystem:npm"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      # Group safe minor/patch bumps so we do not flood the queue.
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # ---------------------------------------------------------------------------
  # AI service (Python, uv-managed; pip ecosystem reads pyproject.toml)
  # ---------------------------------------------------------------------------
  - package-ecosystem: "pip"
    directory: "/ai-service"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ecosystem:pip"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      pip-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # ---------------------------------------------------------------------------
  # GitHub Actions (workflow files in /.github/workflows)
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ecosystem:github-actions"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
