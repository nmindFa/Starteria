# CI pipeline — Phase 0
# Owner: CI-WORKFLOW agent (swarm)
# Scope: monorepo (front/ + ai-service/)
# Contract:
#   - front/ exposes npm scripts: test:backend, test:front, test:coverage, build
#   - ai-service/ uses uv + pytest with markers (unit/integration/contract)
# No secrets are required for this workflow at the moment.

name: CI

on:
  pull_request:
    branches: ['**']
  push:
    branches:
      - main

# Cancel superseded runs on the same branch/PR to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal default permissions for the GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Node tests (vitest, backend + front + coverage gate)
  # ---------------------------------------------------------------------------
  node-tests:
    name: Node tests (vitest + coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./front

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Run tests with coverage
        # The coverage threshold (>=80%) is enforced by vitest config (fail_under).
        # If coverage drops below the gate, this step exits non-zero and the job fails.
        run: npm run test:coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: front-coverage
          path: front/coverage/
          retention-days: 7
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Job 2: Python tests (ai-service, pytest unit suite)
  # ---------------------------------------------------------------------------
  python-tests:
    name: Python tests (pytest -m unit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./ai-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: |
            ai-service/uv.lock
            ai-service/pyproject.toml

      - name: Install dependencies (uv sync --all-extras)
        run: uv sync --all-extras

      - name: Run unit tests with coverage
        run: uv run pytest -m unit --cov --cov-report=xml --cov-report=term

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-service-coverage
          path: ai-service/coverage.xml
          retention-days: 7
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Job 3: Lint + build (Node tsc/vite build, Python ruff check)
  # Independent of test jobs so a flaky test does not mask a broken build.
  # ---------------------------------------------------------------------------
  lint-and-build:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ----- Node side -----
      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Install Node deps (npm ci)
        working-directory: ./front
        run: npm ci

      - name: Build front (vite + tsc)
        working-directory: ./front
        # `npm run build` runs `vite build`; tsc errors will surface here.
        run: npm run build

      # ----- Python side -----
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: |
            ai-service/uv.lock
            ai-service/pyproject.toml

      - name: Install Python deps (uv sync)
        working-directory: ./ai-service
        run: uv sync --all-extras

      - name: Ruff check (advisory in Phase 0)
        working-directory: ./ai-service
        # TODO(Phase 1): drop --exit-zero once a [tool.ruff] config is added to
        # ai-service/pyproject.toml and the existing code passes the chosen ruleset.
        run: uv run ruff check . --exit-zero

  # ---------------------------------------------------------------------------
  # Optional Job 4: e2e-light (placeholder, disabled until Phase 1)
  # Network isolation smoke / browser flow lives here once it is defined.
  # ---------------------------------------------------------------------------
  e2e-light:
    name: E2E light (disabled — Phase 1)
    runs-on: ubuntu-latest
    # Hard-disabled: condition can never be true. Flip to `if: always()` (or
    # remove the guard) once the smoke suite is ready.
    if: ${{ false }}
    steps:
      - name: Placeholder
        run: echo "e2e-light suite is not yet implemented — see Phase 1."

  # ---------------------------------------------------------------------------
  # Job 5: Aggregate summary — runs even on partial failure to give one place
  # to read the verdict in PR checks.
  # ---------------------------------------------------------------------------
  summary:
    name: CI summary
    runs-on: ubuntu-latest
    needs: [node-tests, python-tests, lint-and-build]
    if: always()
    steps:
      - name: Write Markdown summary
        env:
          NODE_RESULT: ${{ needs.node-tests.result }}
          PYTHON_RESULT: ${{ needs.python-tests.result }}
          LINT_RESULT: ${{ needs.lint-and-build.result }}
        run: |
          {
            echo "# CI summary"
            echo ""
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| node-tests      | ${NODE_RESULT} |"
            echo "| python-tests    | ${PYTHON_RESULT} |"
            echo "| lint-and-build  | ${LINT_RESULT} |"
            echo ""
            if [ "${NODE_RESULT}" = "success" ] && [ "${PYTHON_RESULT}" = "success" ] && [ "${LINT_RESULT}" = "success" ]; then
              echo "All required jobs passed."
            else
              echo "One or more required jobs did not succeed. See the failed job logs above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail summary if any required job failed
        env:
          NODE_RESULT: ${{ needs.node-tests.result }}
          PYTHON_RESULT: ${{ needs.python-tests.result }}
          LINT_RESULT: ${{ needs.lint-and-build.result }}
        run: |
          if [ "${NODE_RESULT}" != "success" ] || [ "${PYTHON_RESULT}" != "success" ] || [ "${LINT_RESULT}" != "success" ]; then
            echo "::error::At least one required job failed (node=${NODE_RESULT}, python=${PYTHON_RESULT}, lint=${LINT_RESULT})"
            exit 1
          fi
