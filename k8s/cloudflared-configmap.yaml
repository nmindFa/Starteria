apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: starteria
data:
  config.yaml: |
    tunnel: 4ab484e9-b7f8-4beb-9300-d12265a7a32b
    ingress:
      - hostname: starter-ia.com
        service: http://starteria-frontend:80
        originRequest:
          connectTimeout: 30s
          noTLSVerify: true
          keepAliveConnections: 10
          keepAliveTimeout: 1m30s
          tcpKeepAlive: 30s
          timeout: 1m
      - hostname: www.starter-ia.com
        service: http://starteria-frontend:80
        originRequest:
          connectTimeout: 30s
          noTLSVerify: true
          keepAliveConnections: 10
          keepAliveTimeout: 1m30s
          tcpKeepAlive: 30s
          timeout: 1m
      - hostname: api.starter-ia.com
        service: http://starteria-backend:3001
        originRequest:
          connectTimeout: 30s
          noTLSVerify: true
          keepAliveConnections: 10
          keepAliveTimeout: 1m30s
          tcpKeepAlive: 30s
          timeout: 1m
      - service: http_status:404
    metrics: 0.0.0.0:2000
    protocol: quic
    loglevel: info
    retries: 5
    grace-period: 30s
    no-autoupdate: true
