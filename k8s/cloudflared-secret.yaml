# Cloudflare Tunnel Token Secret
#
# DO NOT apply this file directly. The token must not be stored in version control.
#
# Instead, create the secret manually using kubectl:
#
#   kubectl create secret generic cloudflared-token \
#     -n starteria \
#     --from-literal=token=YOUR_CLOUDFLARE_TUNNEL_TOKEN
#
# To get your tunnel token:
#   1. Go to https://one.dash.cloudflare.com/ -> Zero Trust -> Networks -> Tunnels
#   2. Create or select your tunnel
#   3. Copy the tunnel token from the "Install and run a connector" section
#
# To verify the secret was created:
#   kubectl get secret cloudflared-token -n starteria
#
# To update an existing token:
#   kubectl delete secret cloudflared-token -n starteria
#   kubectl create secret generic cloudflared-token \
#     -n starteria \
#     --from-literal=token=YOUR_NEW_TUNNEL_TOKEN
