apiVersion: apps/v1
kind: Deployment
metadata:
  name: starteria-frontend
  namespace: starteria
  labels:
    app: starteria-frontend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: starteria-frontend
  template:
    metadata:
      labels:
        app: starteria-frontend
    spec:
      containers:
      - name: frontend
        image: orlandogtp/starteria-frontend:v2.0.8
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
